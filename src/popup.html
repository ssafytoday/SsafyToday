<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/popup.css" />
    <title>SsafyToday</title>
  </head>

  <body>
    <div class="grid container">
      <header class="sixteen wide center aligned column">
        <h1 id="title">
          Ssafy
          <span style="color: #0078c3">Today</span>
        </h1>
        <p id="caption">코딩 풀이를 ssafy.today에 자동 기록</p>
      </header>

      <main class="sixteen wide center aligned column">
        <section id="status_mode">
          <!-- AI 힌트 토글 (제출 기록은 이 값과 무관하게 항상 동작한다) -->
          <div class="auto-record-container">
            <div class="auto-record-label">AI 힌트</div>
            <div class="toggle-switch-container">
              <input type="checkbox" id="enable_popup" class="toggle-switch-checkbox" checked />
              <label for="enable_popup" class="toggle-switch-label">
                <span class="toggle-switch-inner"></span>
                <span class="toggle-switch-switch"></span>
              </label>
            </div>
          </div>
        </section>
      </main>

      <footer id="socials" class="sixteen wide column">
        <a title="설정" id="settings_URL" href="settings.html" target="_blank"><i class="settings icon" aria-hidden="true"></i></a>
        <a title="SsafyToday" href="https://ssafy.today" target="_blank"><i class="home icon" aria-hidden="true"></i></a>
      </footer>
    </div>

    <script src="popup.ts" type="module"></script>
</body>
</html>
