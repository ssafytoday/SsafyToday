<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SsafyToday 설정</title>
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="title">🚀 SsafyToday</h1>
        <p class="subtitle">제출 기록 설정</p>
      </div>

      <div class="content">
        <!-- 메시지 -->
        <div id="errorMessage" class="message error"></div>
        <div id="successMessage" class="message success"></div>

        <!-- 기본 설정 -->
        <div id="settingsSection" class="section">
          <h2 class="section-title">기본 설정</h2>

          <div class="card">
            <div class="toggle-section">
              <div>
                <div class="toggle-label">AI 힌트</div>
                <div class="help-text">
                  문제 페이지에 AI 힌트 UI를 표시합니다. 제출 기록은 이 설정과 무관하게 항상 전송됩니다.
                </div>
              </div>
              <label class="toggle">
                <input type="checkbox" id="autoUpload" checked />
                <span class="slider"></span>
                <span class="sr-only">AI 힌트 설정</span>
              </label>
            </div>
          </div>
        </div>

        <!-- SSAFY Today 연동 -->
        <div id="ssafySection" class="section">
          <h2 class="section-title">🌐 SSAFY Today 연동</h2>

          <div class="card">
            <div class="toggle-section">
              <div>
                <div class="toggle-label">서버 연결 상태</div>
                <div class="help-text">제출 데이터가 자동으로 SSAFY Today 서버로 전송됩니다.</div>
              </div>
              <div id="ssafyStatusBadge" style="padding: 6px 12px; border-radius: 4px; font-size: 12px; background: #e2e8f0; color: #4a5568;">
                확인 중...
              </div>
            </div>
            <div class="button-group" style="margin-top: 16px">
              <button id="testSsafyConnection" class="button button-secondary"><span>🔍</span> 연결 테스트</button>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <a href="https://ssafy.today" target="_blank"> 🌐 SSAFY Today 바로가기 </a>
      </div>
    </div>

    <script src="settings.ts" type="module"></script>
  </body>
</html>
